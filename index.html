<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>異世界勇者召喚工具</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: rgba(255, 255, 255, 0.94);
      --text: #172033;
      --muted: #64748b;
      --line: #c7d2fe;
      --primary: #7c3aed;
      --primary-dark: #5b21b6;
      --accent: #14b8a6;
      --gold: #f59e0b;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --ok: #047857;
      --ok-bg: #d1fae5;
      --warn: #92400e;
      --warn-bg: #fef3c7;
      --shadow: 0 18px 45px rgba(30, 27, 75, 0.22);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      background:
        radial-gradient(circle at 12% 10%, rgba(20, 184, 166, 0.34), transparent 28%),
        radial-gradient(circle at 88% 12%, rgba(245, 158, 11, 0.26), transparent 24%),
        radial-gradient(circle at 50% 100%, rgba(124, 58, 237, 0.42), transparent 42%),
        linear-gradient(135deg, #0f172a 0%, #312e81 48%, #064e3b 100%);
      color: var(--text);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.42) 1px, transparent 1.6px),
        radial-gradient(circle, rgba(250,204,21,0.38) 1px, transparent 1.8px);
      background-size: 64px 64px, 110px 110px;
      background-position: 0 0, 18px 36px;
      opacity: 0.24;
    }

    header {
      padding: 34px 20px 16px;
      text-align: center;
      color: #fff;
      position: relative;
      z-index: 1;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 54px);
      letter-spacing: 0.08em;
      text-shadow: 0 0 18px rgba(20, 184, 166, 0.85), 0 5px 18px rgba(0, 0, 0, 0.32);
    }

    header h1::before {
      content: "QUEST";
      display: block;
      width: fit-content;
      margin: 0 auto 8px;
      padding: 4px 14px;
      border: 1px solid rgba(253, 230, 138, 0.88);
      border-radius: 999px;
      color: #fde68a;
      font-size: 13px;
      letter-spacing: 0.24em;
      background: rgba(15, 23, 42, 0.35);
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.32);
    }

    header p {
      margin: 0;
      color: #dbeafe;
      font-size: 17px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.34);
    }

    main {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto 40px;
      position: relative;
      z-index: 1;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(199, 210, 254, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      margin: 16px 0;
      backdrop-filter: blur(10px);
    }

    .card h2 {
      margin: 0 0 16px;
      font-size: 22px;
      color: #312e81;
      letter-spacing: 0.03em;
    }

    .card h3 {
      margin: 18px 0 10px;
      font-size: 18px;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 14px 0 8px;
    }

    input[type="number"],
    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      font-size: 17px;
      outline: none;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.65;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .row > * {
      flex: 1;
      min-width: 180px;
    }

    .radio-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 10px 0;
    }

    .radio-card {
      flex: 1;
      min-width: 220px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      background: #fff;
    }

    .radio-card input {
      margin-right: 8px;
    }

    .radio-card strong {
      display: inline-block;
      margin-bottom: 6px;
    }

    .hint {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin: 8px 0 0;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #e5e7eb;
      color: #111827;
    }

    button.primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      box-shadow: 0 8px 18px rgba(91, 33, 182, 0.22);
    }

    button.primary:hover {
      background: var(--primary-dark);
    }

    button.danger {
      background: var(--danger);
      color: #fff;
    }

    button.ghost {
      background: #fff;
      border: 1px solid var(--line);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .summary {
      background: linear-gradient(135deg, #f8fafc, #eef2ff);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .message {
      margin-top: 14px;
      border-radius: 14px;
      padding: 14px;
      display: none;
      line-height: 1.7;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .message.ok {
      background: var(--ok-bg);
      color: var(--ok);
      border: 1px solid #a7f3d0;
    }

    .message.warn {
      background: var(--warn-bg);
      color: var(--warn);
      border: 1px solid #fde68a;
    }

    .draw-panel {
      display: grid;
      grid-template-columns: minmax(280px, 420px) 1fr;
      gap: 18px;
      align-items: start;
    }

    .big-result {
      text-align: center;
      background:
        radial-gradient(circle at top, rgba(253, 230, 138, 0.38), transparent 42%),
        linear-gradient(135deg, #eef2ff, #ccfbf1);
      border: 1px solid #99f6e4;
      border-radius: 18px;
      padding: 28px 18px;
      margin-top: 18px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: inset 0 0 24px rgba(124, 58, 237, 0.12);
    }

    .big-result .small {
      color: var(--muted);
      font-size: 16px;
    }

    .big-result .main {
      font-size: clamp(28px, 5vw, 50px);
      font-weight: 900;
      line-height: 1.35;
      margin-top: 8px;
      color: #4c1d95;
      text-shadow: 0 0 14px rgba(20, 184, 166, 0.22);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 0 0 16px;
    }

    .stat {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-top: 4px;
    }

    .groups {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    .group-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }

    .group-head {
      padding: 12px 14px;
      font-weight: 900;
      background: linear-gradient(135deg, #ede9fe, #ccfbf1);
      color: #312e81;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .group-body {
      min-height: 72px;
      padding: 12px 14px;
      line-height: 1.8;
    }

    .empty {
      color: var(--muted);
    }

    .history-list {
      max-height: 260px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 10px 14px;
      line-height: 1.8;
    }

    .progress-wrap {
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      height: 14px;
      margin: 8px 0 18px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--primary), var(--gold));
      transition: width 0.25s ease;
    }

    .result-output {
      width: 100%;
      min-height: 420px;
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.8;
      white-space: pre;
    }

    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: #ede9fe;
      color: #4c1d95;
      font-weight: 700;
      margin: 3px;
      font-size: 14px;
      border: 1px solid #c4b5fd;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 840px) {
      .grid,
      .draw-panel {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      body {
        background: #fff;
      }

      header,
      .no-print,
      #setupPage,
      #drawPage {
        display: none !important;
      }

      main {
        width: 100%;
        margin: 0;
      }

      .page {
        display: none;
      }

      #resultPage {
        display: block !important;
      }

      .card {
        box-shadow: none;
        border: 0;
      }

      textarea {
        border: 0;
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>異世界轉生召喚</h1>
    <p>勇者轉生到異世界，成為國家領導人，挑戰環境變遷危機。</p>
  </header>

  <main>
    <section id="setupPage" class="page active">
      <div class="grid">
        <div class="card">
          <h2>一、召喚條件設定</h2>

          <div class="row">
            <div>
              <label for="studentCount">轉生勇者人數</label>
              <input id="studentCount" type="number" min="1" step="1" placeholder="例如：30" />
            </div>
            <div>
              <label for="groupCount">國家團隊數量</label>
              <input id="groupCount" type="number" min="1" step="1" placeholder="例如：6" />
            </div>
          </div>

          <label>國家名稱</label>
          <div class="radio-row">
            <label class="radio-card">
              <input type="radio" name="nameMode" value="manual" checked />
              <strong>手動輸入國家名</strong><br />
              <span class="hint">每行一個名字，數量需等於國家數量。</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="nameMode" value="random" />
              <strong>隨機產生國家名</strong><br />
              <span class="hint">系統從異世界國家詞庫產生不重複名稱。</span>
            </label>
          </div>

          <div id="manualNamesBox">
            <label for="manualGroupNames">手動國家名</label>
            <textarea id="manualGroupNames" placeholder="例如：
讀力國
渡拜國
鐘立國"></textarea>
          </div>

          <div id="randomNamesBox" class="hidden">
            <label>隨機國家名預覽</label>
            <div id="randomNamePreview" class="summary"></div>
            <div class="btn-row">
              <button type="button" class="ghost" id="regenNamesBtn">重新召喚國家名</button>
            </div>
          </div>

          <div class="btn-row">
            <button type="button" class="primary" id="previewBtn">產生任務摘要</button>
            <button type="button" id="fillDefaultBtn">填入任務範例</button>
            <button type="button" class="ghost" id="clearSetupBtn">清除召喚設定</button>
          </div>

          <div id="setupMessage" class="message"></div>
        </div>

        <div class="card">
          <h2>二、確認轉生任務</h2>
          <div id="conditionSummary" class="summary">尚未產生任務摘要。</div>
          <div class="btn-row">
            <button type="button" class="primary" id="startBtn" disabled>確認並進入召喚頁面</button>
          </div>

          <h3>召喚規則</h3>
          <p class="hint">
            系統會先依轉生領導人人數與國家數量計算每組容量。勇者召喚時只會從尚未滿額的組別中隨機分配，避免單一組別人數過多。
          </p>
        </div>
      </div>
    </section>

    <section id="drawPage" class="page">
      <div class="draw-panel">
        <div class="card">
          <h2>勇者召喚</h2>

          <div class="stats">
            <div class="stat">總勇者<strong id="statTotal">0</strong></div>
            <div class="stat">已召喚<strong id="statDrawn">0</strong></div>
            <div class="stat">未召喚<strong id="statRemain">0</strong></div>
          </div>

          <div class="progress-wrap">
            <div id="progressBar" class="progress-bar"></div>
          </div>

          <label for="drawCode">勇者召喚人或勇者召喚紀錄代號</label>
          <input id="drawCode" type="text" placeholder="例如：座號01、王小明、勇者A01" />

          <div class="btn-row">
            <button type="button" class="primary" id="drawBtn">開始勇者召喚</button>
            <button type="button" id="autoFillCodeBtn">自動帶入下一位勇者</button>
          </div>

          <div id="drawMessage" class="message"></div>

          <div class="big-result">
            <div class="small">本次勇者召喚結果</div>
            <div id="latestResult" class="main">尚未勇者召喚</div>
          </div>

          <div class="btn-row no-print">
            <button type="button" class="ghost" id="backSetupBtn">返回任務設定</button>
            <button type="button" class="danger" id="resetAllBtn">重新開局</button>
          </div>
        </div>

        <div class="card">
          <h2>即時國家編成</h2>
          <div id="groupCards" class="groups"></div>

          <h3>勇者召喚順序</h3>
          <div id="historyList" class="history-list">
            <span class="empty">尚無勇者召喚紀錄。</span>
          </div>
        </div>
      </div>
    </section>

    <section id="resultPage" class="page">
      <div class="card">
        <h2>本次分組勇者召喚結果</h2>
        <textarea id="resultOutput" class="result-output" readonly></textarea>

        <div class="btn-row no-print">
          <button type="button" class="primary" id="copyResultBtn">複製編成結果</button>
          <button type="button" id="printResultBtn">列印任務名冊</button>
          <button type="button" class="ghost" id="returnDrawBtn">返回勇者召喚紀錄</button>
          <button type="button" class="danger" id="newDrawBtn">重新開局</button>
        </div>

        <div id="resultMessage" class="message"></div>
      </div>
    </section>
  </main>

  <script>
    const state = {
      total: 0,
      groupCount: 0,
      groupNames: [],
      maxSizes: [],
      groups: [],
      history: [],
      usedCodes: new Set(),
      nextAutoNumber: 1,
      prepared: false
    };

    const namePool = [
      "森林守護者", "潮汐巡禮者", "碳循環術士", "極光觀測團", "珊瑚修復隊", "風暴預報師",
      "冰原調查兵", "藍碳鍊金會", "星火減碳團", "雨林療癒者", "海洋賢者團", "綠能工匠隊",
      "雲端氣象局", "永續方舟隊", "淨水魔導士", "荒漠復育者", "微塑膠獵人", "太陽能騎士",
      "生態結界師", "洋流航海團", "濕地守門人", "星辰觀測所", "火山地熱隊", "循環經濟 guild",
      "冰川守望者", "黑潮偵查隊", "種子保存庫", "大氣修補師", "森海同盟", "氣候解謎社"
    ];

    const $ = (id) => document.getElementById(id);

    const els = {
      setupPage: $("setupPage"),
      drawPage: $("drawPage"),
      resultPage: $("resultPage"),
      studentCount: $("studentCount"),
      groupCount: $("groupCount"),
      manualGroupNames: $("manualGroupNames"),
      manualNamesBox: $("manualNamesBox"),
      randomNamesBox: $("randomNamesBox"),
      randomNamePreview: $("randomNamePreview"),
      setupMessage: $("setupMessage"),
      conditionSummary: $("conditionSummary"),
      previewBtn: $("previewBtn"),
      startBtn: $("startBtn"),
      fillDefaultBtn: $("fillDefaultBtn"),
      clearSetupBtn: $("clearSetupBtn"),
      regenNamesBtn: $("regenNamesBtn"),
      statTotal: $("statTotal"),
      statDrawn: $("statDrawn"),
      statRemain: $("statRemain"),
      progressBar: $("progressBar"),
      drawCode: $("drawCode"),
      drawBtn: $("drawBtn"),
      autoFillCodeBtn: $("autoFillCodeBtn"),
      drawMessage: $("drawMessage"),
      latestResult: $("latestResult"),
      groupCards: $("groupCards"),
      historyList: $("historyList"),
      backSetupBtn: $("backSetupBtn"),
      resetAllBtn: $("resetAllBtn"),
      resultOutput: $("resultOutput"),
      copyResultBtn: $("copyResultBtn"),
      printResultBtn: $("printResultBtn"),
      returnDrawBtn: $("returnDrawBtn"),
      newDrawBtn: $("newDrawBtn"),
      resultMessage: $("resultMessage")
    };

    function showPage(pageId) {
      [els.setupPage, els.drawPage, els.resultPage].forEach(page => page.classList.remove("active"));
      $(pageId).classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showMessage(el, type, text) {
      el.className = "message show " + type;
      el.textContent = text;
    }

    function clearMessage(el) {
      el.className = "message";
      el.textContent = "";
    }

    function getNameMode() {
      return document.querySelector("input[name='nameMode']:checked").value;
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function generateRandomNames(count) {
      const shuffled = shuffle(namePool);
      const names = [];
      for (let i = 0; i < count; i++) {
        if (i < shuffled.length) {
          names.push(shuffled[i]);
        } else {
          names.push("隨機組" + (i + 1));
        }
      }
      return names;
    }

    function updateNameModeUI() {
      const mode = getNameMode();
      if (mode === "manual") {
        els.manualNamesBox.classList.remove("hidden");
        els.randomNamesBox.classList.add("hidden");
      } else {
        els.manualNamesBox.classList.add("hidden");
        els.randomNamesBox.classList.remove("hidden");
        refreshRandomPreview();
      }
      invalidatePrepared();
    }

    function refreshRandomPreview() {
      const count = parsePositiveInt(els.groupCount.value);
      if (!count) {
        els.randomNamePreview.textContent = "請先輸入國家小隊數量。";
        return;
      }
      const names = generateRandomNames(count);
      els.randomNamePreview.innerHTML = names.map(name => `<span class="pill">${escapeHtml(name)}</span>`).join("");
      els.randomNamePreview.dataset.names = JSON.stringify(names);
    }

    function parsePositiveInt(value) {
      const n = Number(value);
      if (!Number.isInteger(n) || n <= 0) return null;
      return n;
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getManualNames() {
      return els.manualGroupNames.value
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(Boolean);
    }

    function getRandomNames(count) {
      try {
        const existing = JSON.parse(els.randomNamePreview.dataset.names || "[]");
        if (existing.length === count) return existing;
      } catch (e) {}
      return generateRandomNames(count);
    }

    function calculateMaxSizes(total, groupCount) {
      const base = Math.floor(total / groupCount);
      const remainder = total % groupCount;
      return Array.from({ length: groupCount }, (_, i) => base + (i < remainder ? 1 : 0));
    }

    function validateSetup() {
      const total = parsePositiveInt(els.studentCount.value);
      const groupCount = parsePositiveInt(els.groupCount.value);

      if (!total) return { ok: false, message: "轉生勇者人數必須是大於0的整數。" };
      if (!groupCount) return { ok: false, message: "國家小隊數量必須是大於0的整數。" };
      if (groupCount > total) return { ok: false, message: "國家小隊數量不能大於轉生勇者人數。" };

      let names;
      if (getNameMode() === "manual") {
        names = getManualNames();
        if (names.length !== groupCount) {
          return { ok: false, message: `手動國家名數量需等於國家小隊數量。目前輸入 ${names.length} 個組名，國家小隊數量為 ${groupCount}。` };
        }
      } else {
        names = getRandomNames(groupCount);
      }

      const duplicateNames = names.filter((name, idx) => names.indexOf(name) !== idx);
      if (duplicateNames.length > 0) {
        return { ok: false, message: "國家名稱不可重複。" };
      }

      return { ok: true, total, groupCount, names };
    }

    function buildSummary(total, groupCount, names) {
      const sizes = calculateMaxSizes(total, groupCount);
      const sizeText = summarizeSizes(sizes);
      return [
        `轉生勇者人數：${total}人`,
        `國家小隊數量：${groupCount}組`,
        `戰力分配：${sizeText}`,
        `國家名稱：${names.join("、")}`,
        "",
        "各國家容量：",
        ...names.map((name, i) => `${name}：${sizes[i]}人`)
      ].join("\n");
    }

    function summarizeSizes(sizes) {
      const map = new Map();
      sizes.forEach(size => map.set(size, (map.get(size) || 0) + 1));
      const parts = [...map.entries()]
        .sort((a, b) => b[0] - a[0])
        .map(([size, count]) => `${count}組${size}人`);
      return parts.join("，");
    }

    function invalidatePrepared() {
      state.prepared = false;
      els.startBtn.disabled = true;
    }

    function previewSetup() {
      clearMessage(els.setupMessage);
      const result = validateSetup();
      if (!result.ok) {
        showMessage(els.setupMessage, "error", result.message);
        els.conditionSummary.textContent = "尚未產生有效條件摘要。";
        els.startBtn.disabled = true;
        return;
      }

      const { total, groupCount, names } = result;
      els.conditionSummary.textContent = buildSummary(total, groupCount, names);
      state.prepared = true;
      els.startBtn.disabled = false;
      showMessage(els.setupMessage, "ok", "條件摘要已產生。確認後可進入勇者召喚頁面。");
    }

    function startDraw() {
      const result = validateSetup();
      if (!result.ok) {
        showMessage(els.setupMessage, "error", result.message);
        return;
      }

      state.total = result.total;
      state.groupCount = result.groupCount;
      state.groupNames = result.names;
      state.maxSizes = calculateMaxSizes(result.total, result.groupCount);
      state.groups = state.groupNames.map((name, index) => ({
        name,
        max: state.maxSizes[index],
        members: []
      }));
      state.history = [];
      state.usedCodes = new Set();
      state.nextAutoNumber = 1;

      clearMessage(els.drawMessage);
      els.latestResult.textContent = "尚未勇者召喚";
      els.drawCode.value = "";

      renderDrawPage();
      showPage("drawPage");
      setTimeout(() => els.drawCode.focus(), 200);
    }

    function renderDrawPage() {
      const drawn = state.history.length;
      const remain = state.total - drawn;
      els.statTotal.textContent = state.total;
      els.statDrawn.textContent = drawn;
      els.statRemain.textContent = remain;
      els.progressBar.style.width = state.total ? `${(drawn / state.total) * 100}%` : "0%";

      els.groupCards.innerHTML = state.groups.map(group => {
        const members = group.members.length
          ? group.members.map(member => `<div>${escapeHtml(member)}</div>`).join("")
          : `<span class="empty">尚無成員</span>`;
        return `
          <div class="group-card">
            <div class="group-head">
              <span>${escapeHtml(group.name)}</span>
              <span>${group.members.length}/${group.max}</span>
            </div>
            <div class="group-body">${members}</div>
          </div>
        `;
      }).join("");

      if (state.history.length === 0) {
        els.historyList.innerHTML = `<span class="empty">尚無勇者召喚紀錄。</span>`;
      } else {
        els.historyList.innerHTML = state.history
          .map((item, idx) => `<div>第${idx + 1}抽：${escapeHtml(item.code)} → ${escapeHtml(item.groupName)}</div>`)
          .join("");
        els.historyList.scrollTop = els.historyList.scrollHeight;
      }

      els.drawBtn.disabled = remain <= 0;
      els.autoFillCodeBtn.disabled = remain <= 0;
    }

    function drawGroup() {
      clearMessage(els.drawMessage);

      if (state.history.length >= state.total) {
        completeDraw();
        return;
      }

      const code = els.drawCode.value.trim();
      if (!code) {
        showMessage(els.drawMessage, "error", "請先輸入勇者召喚人或勇者召喚紀錄代號。");
        els.drawCode.focus();
        return;
      }

      if (state.usedCodes.has(code)) {
        showMessage(els.drawMessage, "error", "此代號已完成勇者召喚，不能重複勇者召喚。");
        els.drawCode.select();
        return;
      }

      const availableGroups = state.groups.filter(group => group.members.length < group.max);
      if (availableGroups.length === 0) {
        completeDraw();
        return;
      }

      const minCurrentSize = Math.min(...availableGroups.map(group => group.members.length));
      const balancedCandidates = availableGroups.filter(group => group.members.length === minCurrentSize);
      const chosen = balancedCandidates[Math.floor(Math.random() * balancedCandidates.length)];

      chosen.members.push(code);
      state.usedCodes.add(code);
      state.history.push({ code, groupName: chosen.name });

      els.latestResult.textContent = `勇者召喚代號「${code}」是「${chosen.name}」`;
      showMessage(els.drawMessage, "ok", `勇者召喚完成：${code} → ${chosen.name}`);
      els.drawCode.value = "";
      renderDrawPage();

      if (state.history.length >= state.total) {
        setTimeout(completeDraw, 450);
      } else {
        els.drawCode.focus();
      }
    }

    function completeDraw() {
      renderResultPage();
      showPage("resultPage");
    }

    function renderResultPage() {
      const now = new Date();
      const timestamp = now.toLocaleString("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });

      const lines = [];
      lines.push("本次分組勇者召喚結果");
      lines.push(`編成時間：${timestamp}`);
      lines.push(`轉生勇者人數：${state.total}人`);
      lines.push(`國家小隊數量：${state.groupCount}組`);
      lines.push(`戰力分配：${summarizeSizes(state.maxSizes)}`);
      lines.push("");
      lines.push("一、國家名單");
      lines.push("");

      state.groups.forEach(group => {
        lines.push(`${group.name}（${group.members.length}/${group.max}人）`);
        if (group.members.length) {
          group.members.forEach(member => lines.push(`- ${member}`));
        } else {
          lines.push("- 無");
        }
        lines.push("");
      });

      lines.push("二、勇者召喚順序");
      state.history.forEach((item, index) => {
        lines.push(`第${index + 1}抽：${item.code} → ${item.groupName}`);
      });

      els.resultOutput.value = lines.join("\n");
      clearMessage(els.resultMessage);
    }

    async function copyResult() {
      try {
        await navigator.clipboard.writeText(els.resultOutput.value);
        showMessage(els.resultMessage, "ok", "編成結果已複製。");
      } catch (err) {
        els.resultOutput.select();
        document.execCommand("copy");
        showMessage(els.resultMessage, "ok", "編成結果已複製。");
      }
    }

    function resetAll() {
      state.total = 0;
      state.groupCount = 0;
      state.groupNames = [];
      state.maxSizes = [];
      state.groups = [];
      state.history = [];
      state.usedCodes = new Set();
      state.nextAutoNumber = 1;
      state.prepared = false;

      els.studentCount.value = "";
      els.groupCount.value = "";
      els.manualGroupNames.value = "";
      els.conditionSummary.textContent = "尚未產生任務摘要。";
      els.randomNamePreview.textContent = "";
      els.latestResult.textContent = "尚未勇者召喚";
      els.drawCode.value = "";
      els.resultOutput.value = "";
      els.startBtn.disabled = true;
      clearMessage(els.setupMessage);
      clearMessage(els.drawMessage);
      clearMessage(els.resultMessage);
      renderDrawPage();
      showPage("setupPage");
    }

    function fillDefault() {
      els.studentCount.value = "30";
      els.groupCount.value = "6";
      document.querySelector("input[name='nameMode'][value='manual']").checked = true;
      updateNameModeUI();
      els.manualGroupNames.value = ["森林守護者", "潮汐巡禮者", "碳循環術士", "極光觀測團", "珊瑚修復隊", "風暴預報師"].join("\n");
      previewSetup();
    }

    function autoFillNextCode() {
      while (state.usedCodes.has(String(state.nextAutoNumber).padStart(2, "0"))) {
        state.nextAutoNumber++;
      }
      const code = "勇者" + String(state.nextAutoNumber).padStart(2, "0");
      state.nextAutoNumber++;
      els.drawCode.value = code;
      els.drawCode.focus();
      els.drawCode.select();
    }

    document.querySelectorAll("input[name='nameMode']").forEach(radio => {
      radio.addEventListener("change", updateNameModeUI);
    });

    els.studentCount.addEventListener("input", invalidatePrepared);
    els.groupCount.addEventListener("input", () => {
      invalidatePrepared();
      if (getNameMode() === "random") refreshRandomPreview();
    });
    els.manualGroupNames.addEventListener("input", invalidatePrepared);

    els.previewBtn.addEventListener("click", previewSetup);
    els.startBtn.addEventListener("click", startDraw);
    els.fillDefaultBtn.addEventListener("click", fillDefault);
    els.clearSetupBtn.addEventListener("click", resetAll);
    els.regenNamesBtn.addEventListener("click", () => {
      refreshRandomPreview();
      invalidatePrepared();
    });

    els.drawBtn.addEventListener("click", drawGroup);
    els.drawCode.addEventListener("keydown", (event) => {
      if (event.key === "Enter") drawGroup();
    });
    els.autoFillCodeBtn.addEventListener("click", autoFillNextCode);
    els.backSetupBtn.addEventListener("click", () => showPage("setupPage"));
    els.resetAllBtn.addEventListener("click", resetAll);

    els.copyResultBtn.addEventListener("click", copyResult);
    els.printResultBtn.addEventListener("click", () => window.print());
    els.returnDrawBtn.addEventListener("click", () => showPage("drawPage"));
    els.newDrawBtn.addEventListener("click", resetAll);

    updateNameModeUI();
  </script>
</body>
</html>
